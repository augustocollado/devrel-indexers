manifestVersion: subsquid.io/v0.1
name: mainnetsidxs
version: 1
description: A template for EVM mainnets
build: 
deploy:
  addons:
    postgres: 
      config:
        statement_timeout: 300000
  processor:
    cmd:
      - sqd
      - process:prod
    env:
      RPC_ENDPOINT: ${{ secrets.RPC_ENDPOINT }}
      AGGREGATION_INTERVAL_MINUTES: ${{ secrets.AGGREGATION_INTERVAL_MINUTES }}
      START_BLOCK: ${{ secrets.START_BLOCK }}
  api:
    cmd:
      - sqd
      - serve:prod
scale:
  dedicated: false